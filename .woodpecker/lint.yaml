when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:0e08426d6e280d0eed1479fe8fa8c0f75e1026bee0a746a3e8466c8233435616
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
