when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:aad755e8248c93d0a92e2b7f4a25f5ffa08bd36798df1b2a0d6efa1f6982c57b
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
