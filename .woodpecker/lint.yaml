when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:05f1da9a5dc6697b36220cf1d3a3cd0e7f462456983eb56d6c1870088d0afa3e
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
