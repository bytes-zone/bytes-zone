when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:45a52ab8ed27f63312ba3f51f13362b9902c84536d43f7096d547c46791b8b76
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
