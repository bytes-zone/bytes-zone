when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:0e4c7634244a6e09b99bf2b5aa2934d29837c400a6af53dd6fb3690b92b1d31f
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
