when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:05360b08fb68ace24d4814adaa6f36371584f6931782ead4891872049667af5a
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
