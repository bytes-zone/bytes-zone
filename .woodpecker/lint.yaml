when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:19c31905419154f917a96da6036a0cbed5c3553b88933ef87a3e25a5dc0a18c2
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
