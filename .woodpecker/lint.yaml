when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:382130f5199bc06d36964d7b7cf5e780921e661ff32a0567e602001263949914
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
