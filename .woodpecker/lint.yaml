when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:7769fb680659f7730db5b9c0d245c00ba517dfec9c720f6679248cb32e124095
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
