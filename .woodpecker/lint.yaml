when:
  event: [push, manual]

steps:
  - name: lint
    image: jdxcode/mise:debian@sha256:e2efdfd1243dfa8f24831208ab4d91ef811d0640f8ead9e25aa604307961a019
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run lint
    volumes:
      - bytes-zone-mise:/root/mise
