when:
  event: [push, manual]

steps:
  - name: build
    image: jdxcode/mise:debian@sha256:0e4c7634244a6e09b99bf2b5aa2934d29837c400a6af53dd6fb3690b92b1d31f
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run build:release
    volumes:
      - bytes-zone-mise:/root/mise

  - name: push container
    image: woodpeckerci/plugin-docker-buildx@sha256:60950473496ca6f0ba2a29405b50bbc841e48912653ae5ee93b5e398ed34156b
    settings:
      repo: ghcr.io/bytes-zone/bytes-zone
      tag:
        - main
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile

      registry: ghcr.io
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_password
    when:
      - branch: main
