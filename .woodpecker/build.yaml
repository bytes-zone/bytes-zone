when:
  event: [push, manual]

steps:
  - name: build
    image: jdxcode/mise:debian@sha256:a7df8beaeca2fc6d2e829278e5eef253330db5cde50bb196462616573107b120
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run build:release
    volumes:
      - bytes-zone-mise:/root/mise

  - name: push container
    image: woodpeckerci/plugin-docker-buildx@sha256:72ab029342e7c048a4e62a2bc909b1d7e860fe8c7a482a995b01c4aa350cae2a
    settings:
      repo: ghcr.io/bytes-zone/bytes-zone
      tag:
        - main
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile

      registry: ghcr.io
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_password
    when:
      - branch: main
