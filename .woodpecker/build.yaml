when:
  event: [push, manual]

steps:
  - name: build
    image: jdxcode/mise:debian@sha256:9ab8d63389bf7d787f0b762e02f7b8fd5ada3d076d3e808a1f818ece155b6fe7
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run build:release
    volumes:
      - bytes-zone-mise:/root/mise

  - name: push container
    image: woodpeckerci/plugin-docker-buildx@sha256:968d23281a2a8b0aae73576906d81b10246644f83599d4149f6376c7e58d746f
    settings:
      repo: ghcr.io/bytes-zone/bytes-zone
      tag:
        - main
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile

      registry: ghcr.io
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_password
    when:
      - branch: main
