when:
  event: [push, manual]

steps:
  - name: build
    image: jdxcode/mise:debian@sha256:7769fb680659f7730db5b9c0d245c00ba517dfec9c720f6679248cb32e124095
    pull: true
    environment:
      MISE_TASK_OUTPUT: prefix
      MISE_DATA_DIR: /root/mise/data
      MISE_CACHE_DIR: /root/mise/cache
      MISE_STATE_DIR: /root/mise/state
    commands:
      - mise run build:release
    volumes:
      - bytes-zone-mise:/root/mise

  - name: push container
    image: woodpeckerci/plugin-docker-buildx@sha256:9cf361d051a35dc530a106ac41c9957c01c6865ee922467fb5b76984ad79fc34
    settings:
      repo: ghcr.io/bytes-zone/bytes-zone
      tag:
        - main
        - ${CI_COMMIT_SHA}
      dockerfile: Dockerfile

      registry: ghcr.io
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_password
    when:
      - branch: main
